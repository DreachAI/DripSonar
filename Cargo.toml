[package]
name = "dripsonar"
version = "0.1.0"
edition = "2024"
description = "Self-hosted web scrape and search engine with Firecrawl-compatible endpoints"

[[bin]]
name = "sonar"
path = "src/main.rs"

[features]
# Test-only constructors (injected resolver); never enabled in release builds.
test-support = []

[dependencies]
axum = "0.8"
bytes = "1.12"
clap = { version = "4.6", features = ["derive", "env"] }
dom_query = "0.28"
encoding_rs = "0.8"
futures = "0.3"
fs2 = "0.4"
flate2 = "1.1"
quick-xml = "0.38"
regex = "1.13"
htmd = "0.5"
pdf_oxide = { version = "0.3", default-features = false }
# SOCKS local resolution through the destination guard depends on reqwest 0.12 behavior.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "stream", "socks"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs", "io-util", "process"] }
tokio-socks = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.28", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
rlimit = "0.10"

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
