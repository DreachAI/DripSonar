[package]
name = "dripsonar"
version = "0.1.0"
edition = "2024"
description = "Self-hosted web scrape and search engine with Firecrawl-compatible endpoints"

[[bin]]
name = "sonar"
path = "src/main.rs"

[features]
# Test-only constructors (injected resolver); never enabled in release builds.
test-support = []

[dependencies]
axum = "0"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dom_query = "0"
encoding_rs = "0"
futures = "0"
htmd = "0"
pdf_oxide = { version = "0", default-features = false }
reqwest = { version = "0", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "stream", "socks"] }
rusqlite = { version = "0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0"
thiserror = "2"
time = { version = "0", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs", "io-util", "process"] }
tokio-socks = "0.5"
tracing = "0"
tracing-subscriber = { version = "0", features = ["env-filter", "fmt", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
